name: Fixture parser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e 'backend[dev]'
      - name: Run synthetic fixture tests
        run: PYTHONPATH=backend/src pytest backend/tests/unit/test_menu_parser.py backend/tests/unit/test_label_parser.py
